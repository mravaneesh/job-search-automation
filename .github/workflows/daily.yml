name: Daily Job Search

# Runs the full Phase 1→3 pipeline once a day and on demand:
#   migrate → collect → score → report (dashboard) → notify
#
# Requires a PERSISTENT database (secrets.DATABASE_URL). The notification dedup
# state lives in that DB, so an ephemeral DB would re-notify every run. See
# DEPLOYMENT.md.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Publish the dashboard to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-job-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Notification dedup and"\
                 "'jobs found today' need a persistent database. See DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Migrate
        run: python -m jobsearch migrate

      - name: Collect
        run: python -m jobsearch collect

      - name: Score
        run: python -m jobsearch score

      - name: Build dashboard
        run: python -m jobsearch report --format html --output dashboard/index.html

      - name: Notify (new / changed / high-priority only)
        run: python -m jobsearch notify

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

  deploy-pages:
    needs: run
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
