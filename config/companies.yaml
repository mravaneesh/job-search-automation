# Company / source registry — the single source of truth for collection targets.
#
# status:
#   implemented -> a deterministic collector exists and the token is verified
#   pending     -> registered for coverage tracking; collector or token not yet confirmed
#
# Tokens for pending entries are best-effort guesses and MUST be verified before
# flipping to "implemented". The registry doubles as a coverage map.

companies:
  # ---------- Global ----------
  - name: Google
    category: global
    source: career_page
    status: pending          # bespoke careers API (careers.google.com/api/v3)
  - name: Microsoft
    category: global
    source: career_page
    status: pending
  - name: Amazon
    category: global
    source: career_page
    status: implemented
    spec:
      url: "https://www.amazon.jobs/en/search.json"
      params:
        base_query: "software engineer"
        result_limit: 100
      results_path: "jobs"
      pagination: { offset_param: "offset", page_size: 100, max_pages: 3 }
      url_prefix: "https://www.amazon.jobs"
      fields:
        source_job_id: "id_icims"
        title: "title"
        url: "job_path"
        location: "normalized_location"
        description_html: "description"
        created_date: "posted_date"
        employment_type: "job_schedule_type"
  - name: Meta
