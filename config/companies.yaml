# Aggregator search targets (Playwright-based, deterministic DOM extraction).
# These are searched by role query, not per-company. Marked pending because
# they are brittle and subject to anti-bot defences / ToS limits.
aggregators:
  - source: linkedin
    status: pending
    locations: ["India", "Remote"]
  - source: indeed
    status: pending
    locations: ["India"]
  - source: naukri
    status: pending
    locations: ["India"]
  - source: wellfound
    status: pending
    locations: ["India", "Remote"]
