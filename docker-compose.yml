services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch
      POSTGRES_DB: jobsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jobsearch:jobsearch@db:5432/jobsearch
      LOG_LEVEL: INFO
    # Apply migrations, then run a dry-run collection by default.
    command: ["collect", "--dry-run"]

volumes:
  pgdata:
